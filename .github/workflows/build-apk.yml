name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle (sin necesitar wrapper pre-generado)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK de depuración
        id: build
        run: gradle :app:assembleDebug --no-daemon --stacktrace > /tmp/build_log.txt 2>&1
        continue-on-error: true

      - name: Si falló, subir el log como archivo en el repo (para poder leerlo)
        if: steps.build.outcome == 'failure'
        run: |
          tail -c 60000 /tmp/build_log.txt > build_log.txt
          git config user.email "ci@local"
          git config user.name "CI"
          git add build_log.txt -f
          git commit -m "CI: log de build fallido [skip ci]"
          git push origin HEAD:ci-logs --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Marcar el job como fallido si falló la compilación
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Subir el APK como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: coupon-watcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
